# Dienst page: Marketing strategie (www.veryklear.com/marketing-strategie).
# Change the text after the colon, keep the indentation. Fields ending in _html
# may contain <br> (line break). No bold in titles. The artikels at the bottom are added automatically.

meta:
  title: Marketingstrategie | Very Klear Marketing Agency
  description: Van alles een beetje werkt niet. Een marketingstrategie kiest de kanalen, tools en mensen die bij je zaak passen, en zorgt dat alles op elkaar aansluit.

hero:
  title_html: Marketingstrategie.<br />Minder kanalen, beter gekozen.
  lead: Posts, ads, een nieuwsbrief, een beurs? Van alles een beetje werkt niet. We kiezen samen wat bij je zaak past, zodat je weer focus hebt en ziet wat het oplevert.
  button: Plan een strategiesessie

when:
  title: Herkenbaar?
  items:
  - Je doet een beetje van alles, maar niets lijkt echt te werken.
  - Er kwam een kanaal bij omdat de concurrent het heeft.
  - Je twijfelt tussen veel content of meer diepgang.
  - Je advertenties sturen mensen naar een pagina die niets zegt.
questions:
  title: Wat we samen uitzoeken
  items:
  - Welke kanalen wel, en welke niet?
  - Organisch, betaald, digitaal of offline?
  - Veel content of veel diepgang?
  - Meer focus op sales, marketing of product?
  - Welke tools heb je echt nodig?
  - Hoeveel mensen en welke experts?
  - Klopt de weg van eerste klik tot klant?
  - Waar helpt AI, en waar niet?
approach:
  title: Hoe gaan we te werk?
  steps:
  - title: Waar gaan tijd en budget nu naartoe?
    text: Een eerlijke blik op wat je vandaag doet, en of die kanalen ooit bewust gekozen zijn of gewoon zijn blijven hangen.
  - title: Kiezen wat blijft
    text: Een plan met minder, maar beter. Wie wat doet, hoeveel tijd het vraagt en welke tools je nodig hebt.
  - title: De weg nalopen
    text: Van advertentie tot contact. Sluit je pagina aan op wat de advertentie belooft? En is een eigen landingspagina zinvol?

deliver:
  title: Wat je krijgt
  text: Een plan met focus, waar je meteen mee aan de slag kan. Blijkt een nieuwe site of landingspagina de volgende stap, dan zit dat werk hier, niet als apart project.

leads_to:
  title: En daarna?
  items:
  - title: Website of landingspagina
    text: Met een design- of platformpartner, afhankelijk van wat er nodig is.
    href: /partners
  - title: Een campagne
    text: Gericht, met een begin en een einde, op de kanalen die overbleven.
  - title: AI implementeren
    text: Content, tools en opvolging die we met AI mee bouwen.
    href: /ai
  - title: In-house
    text: Als je iemand zoekt die het plan wekelijks mee uitvoert.
    href: /in-house

partners:
  title: Met wie we samenwerken
  keys: [linkedin, social_content, fotografie, platform]

faq:
  title: Vragen over marketingstrategie
  items:
  - q: Moet ik op elk kanaal aanwezig zijn?
    a: Bijna nooit. Eén kanaal goed doen brengt meer op dan vijf half. Welk kanaal dat is, hangt af van waar je klanten echt zitten.
  - q: Doen jullie ook de uitvoering?
    a: Ja. Deels zelf, deels met vaste partners voor bijvoorbeeld LinkedIn, social content of fotografie. Het contact blijft bij ons. Wil je alles uitbesteden, kijk dan eens naar in-house.
  - q: Hebben jullie mijn positionering nodig?
    a: 'Het helpt. Zonder verhaal geen strategie: weet je nog niet voor wie je het doet, dan is elke kanaalkeuze een gok. Dat bekijken we in de strategiesessie.'
  - q: Wat kost een marketingstrategie?
    a: Dat hangt af van wat je zoekt. We bespreken het na de strategiesessie, met een duidelijke scope.

articles:
  title: Artikels over marketingstrategie

cta:
  heading: Benieuwd welke kanalen je kan schrappen?
  body: Daar is de strategiesessie voor. Een uurtje, over wat nu werkt en wat niet.

meta:
  title: Marketingstrategie laten opstellen | Very Klear Marketing Agency
  description: 'Een marketingstrategie laten opstellen die bij je bedrijf past: de juiste kanalen, tools en mensen, in een plan waar je meteen mee aan de slag kan.'

hero:
  title_html: Van alles een beetje werkt niet.<br />Met een duidelijke strategie krijg je weer focus.
  lead: 'Posts, ads, een nieuwsbrief, een beurs? We helpen je een marketingstrategie opstellen die bij je bedrijf past: de juiste kanalen, tools en mensen, en hoeveel tijd waar naartoe gaat. Zo weet je weer waar je mee bezig bent, en zie je wat het oplevert.'
  button: Plan een strategiesessie

when:
  title: Herkenbaar?
  items:
  - Je doet een beetje van alles, maar niets lijkt echt te werken.
  - Er kwam een kanaal bij omdat de concurrent het heeft.
  - Je twijfelt tussen veel content of meer diepgang.
  - Je advertenties sturen mensen naar een pagina die niets zegt.
  - Je weet niet goed waar je tijd en budget nu naartoe gaan.
questions:
  title: Wat we samen uitzoeken
  items:
  - Welke kanalen wel, en welke niet?
  - Organisch, betaald, digitaal of offline?
  - Veel content of veel diepgang?
  - Meer focus op sales, marketing of product?
  - Welke tools heb je echt nodig?
  - Hoeveel mensen en welke experts?
  - Klopt de weg van eerste klik tot klant?
  - Waar helpt AI, en waar niet?
consequences:
  title: En wat gebeurt er dan?
  lead: Niemand kiest bewust voor van alles een beetje. Het groeit gewoon zo, kanaal per kanaal.
  items:
  - title: Elk kanaal krijgt een beetje
    text: Je tijd en budget raken verdeeld over zoveel kanalen dat er nergens genoeg overblijft om het deftig te doen.
  - title: Je ziet niet wat werkt
    text: Als alles tegelijk loopt, weet je achteraf niet welk kanaal die nieuwe klant bracht. Dus blijft alles gewoon verder draaien.
  - title: De klik leidt nergens heen
    text: Een advertentie trekt mensen aan, maar de pagina erachter vertelt een ander verhaal. Wie klikt, vindt niet wat er beloofd werd.
approach:
  title: Hoe gaan we te werk?
  steps:
  - title: Waar gaan tijd en budget nu naartoe?
    text: Een eerlijke blik op wat je vandaag doet, en of die kanalen ooit bewust gekozen zijn of gewoon zijn blijven hangen.
  - title: Kiezen wat blijft
    text: Een plan met minder kanalen, die je wel goed doet. Wie wat doet, hoeveel tijd het vraagt en welke tools je nodig hebt.
  - title: De weg nalopen
    text: Van advertentie tot contact. Sluit je pagina aan op wat de advertentie belooft? En is een eigen landingspagina zinvol?

deliver:
  title: Wat je krijgt
  text: Een marketingplan voor je bedrijf, met focus, waar je meteen mee aan de slag kan. Blijkt een nieuwe site of landingspagina de volgende stap, dan zit dat werk hier, niet als apart project.

transformation:
  title: Wat verandert er?
  lead: Hetzelfde bedrijf, dezelfde mensen. Alleen nu met een plan.
  before_title: Vandaag
  before:
  - Je bent op vijf kanalen aanwezig, maar op geen enkel echt goed.
  - Een nieuw kanaal komt erbij omdat de concurrent het heeft.
  - 'Elke week opnieuw kiezen: een post, een advertentie of toch die nieuwsbrief?'
  - Je weet niet welk kanaal je laatste klant bracht.
  - Je advertentie belooft iets wat de pagina erachter niet waarmaakt.
  after_title: Met een marketingstrategie
  after:
  - Je zit op minder kanalen, en die doe je deftig.
  - Een nieuw kanaal komt er alleen bij als het bij je klanten past.
  - Je weet wie wat doet, en hoeveel tijd het elke week vraagt.
  - Je ziet welk kanaal klanten oplevert, en waar je kan schrappen.
  - Van advertentie tot contact vertelt alles hetzelfde verhaal.
mid_cta:
  title: Eerst even sparren?
  text: Een uurtje over wat je vandaag doet en waar je focus best naartoe gaat. Daarna weet je of een marketingstrategie de juiste stap is.
  button: Plan een strategiesessie

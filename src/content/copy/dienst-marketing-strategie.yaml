faq:
  title: Vragen over marketingstrategie
  items:
  - q: Wat zit er in een marketingstrategie?
    a: 'Bij ons vier dingen: welke kanalen je gebruikt en welke niet, welke tools en mensen je nodig hebt, hoeveel tijd waar naartoe gaat, en of de weg van eerste klik tot klant klopt. Je krijgt het als een marketingplan voor je bedrijf, waar je meteen mee aan de slag kan.'
  - q: Moet ik op elk kanaal aanwezig zijn?
    a: Bijna nooit. Eén kanaal goed doen brengt meer op dan vijf half. Welk kanaal dat is, hangt af van waar je klanten echt zitten.
  - q: Doen jullie ook de uitvoering?
    a: Ja. Deels zelf, deels met vaste partners voor bijvoorbeeld LinkedIn, social content of fotografie. Het contact blijft bij ons. Wil je alles uitbesteden, kijk dan eens naar in-house.
  - q: Hebben jullie mijn positionering nodig?
    a: 'Het helpt. Zonder verhaal geen strategie: weet je nog niet voor wie je het doet, dan is elke kanaalkeuze een gok. Dat bekijken we in de strategiesessie.'
  - q: Wat kost een marketingstrategie?
    a: Dat hangt af van wat je zoekt. We bespreken het na de strategiesessie, met een duidelijke scope.


when:
  title: Herkenbaar?
  items:
  - Je weet niet met welke tools en modellen je moet beginnen.
  - Iedereen in je team gebruikt AI, maar elk op zijn eigen manier.
  - Wat eruit komt, klinkt niet als jou.
  - Flyers en visuals uit AI zien er druk uit, en alles lijkt even belangrijk.
  - Er is een tool gekocht of gebouwd, maar niemand gebruikt hem.
  - De rekening van je AI-abonnementen loopt op, en je weet niet goed waarom.
  - Je wil een website met AI bouwen, maar je weet niet hoe je dat onder controle houdt.
  - Dezelfde taak komt elke week terug en vreet tijd.
questions:
  title: Wat we samen bouwen
  items:
  - De juiste tools en modellen, goed ingesteld
  - Claude of Copilot op maat van je team
  - Skills voor het werk dat steeds terugkomt
  - Richtlijnen zodat AI jouw designs en schrijfstijl volgt
  - Content in je eigen stem
  - Een website die je zelf kan nalezen en onderhouden
  - Interne tools op maat
  - CRM en opvolging die zichzelf bijhouden
  - Automatisering waar het kan, mensenwerk waar het moet
consequences:
  title: En wat doet dat?
  lead: Zonder afspraken loopt AI in marketing meestal op drie plaatsen vast.
  items:
  - title: Alles klinkt hetzelfde
    text: Zonder richtlijnen schrijft AI zoals het hele internet schrijft. Je teksten en visuals lijken dan op die van je concurrent, en je klant ziet het verschil niet meer.
  - title: Tools die blijven liggen
    text: Er komt een tool bij omdat het kan. Maar als de data niet klopt, als hij geen bestaand werk vervangt of als niemand hem onderhoudt, dan gebruikt na een maand niemand hem nog.
  - title: Een hoge rekening
    text: Wie voor elke taak het zwaarste model kiest, betaalt voor denkkracht die eenvoudig tekstwerk niet nodig heeft. Het werk gaat er ook niet sneller door.
# Three stages, Kjell 2026-10-21. Very Klear is the one you talk to about
# implementing; the AI-geletterdheid training for groups is a partner's.
stages:
  title: Wat we doen, waar je ook staat.
  lead: Hoe ver sta je al met AI? Je hoeft niet bij het begin te starten.
  items:
  - name: Nog geen AI
    situation: Je gebruikt nog geen AI, of enkel eens ChatGPT voor een mailtje.
    what:
    - Eerst praten over wat je vandaag tijd kost, pas daarna over tools
    - De juiste tools voor wat jij nodig hebt, en wat ze kosten
    - Afspraken over welke gegevens erin mogen en welke niet
    - Een opleiding AI-geletterdheid voor je team, via een partner, over hoe AI werkt en hoe je het veilig gebruikt. Wij helpen bij de invoering zelf.
  - name: Net begonnen
    situation: Je hebt ChatGPT, Copilot of Claude, maar het blijft bij losse vragen.
    what:
    - Skills installeren voor het werk dat steeds terugkomt
    - Goede gewoontes, van hoe je vraagt tot hoe je controleert
    - Je tools aan elkaar koppelen, zoals mail, agenda, documenten en CRM
    - Vaste instructies, zodat iedereen in je team hetzelfde resultaat krijgt
  - name: Dagelijks met AI
    situation: AI zit al elke dag in je werk, en je wil er meer uit halen.
    what:
    - Wat je nog kan automatiseren, en waar een mens moet blijven meekijken
    - Waar de gaten zitten in je werkwijze en je tools
    - Betere kwaliteit van je leads, je content en je designs
    - Waar je op tokenkosten kan besparen
    - Interne tools en systemen die we mee bouwen

approach:
  title: Hoe gaan we te werk?
  steps:
  - title: Waar sta je nu?
    text: Welke tools je team gebruikt, wat per persoon verschilt, welke taak elke week terugkomt en welke data al klopt. Zo zien we snel waar AI helpt en waar niet.
  - title: Hebben we dit echt nodig?
    text: Per taak een eerlijke keuze tussen AI, een eenvoudige automatisering of mensenwerk. Voor we iets bouwen, weten we welk bestaand werk het vervangt en wie het straks onderhoudt. Veel heeft geen AI nodig.
  - title: We bouwen het mee
    text: In de tools die je al gebruikt, naast je team. Met vaste instructies en kleine stappen die we één voor één nakijken. Geen rapport om zelf uit te voeren, wel iets dat draait en waarvan je ziet wat het opbrengt.
deliver:
  title: Wat je krijgt
  text: Een AI-marketingstrategie op jouw niveau, en wat erin staat ook gebouwd. Van goed ingestelde tools en richtlijnen voor je stijl tot een interne tool of een systeem dat effectief draait.


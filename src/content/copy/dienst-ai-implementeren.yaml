when:
  title: Herkenbaar?
  items:
  - Je weet niet met welke tools en modellen je moet beginnen.
  - Sommige mensen in je team gebruiken AI, maar elk op hun eigen manier.
  - Wat eruit komt, klinkt niet als jou.
  - Flyers en visuals uit AI zien er druk uit, en alles lijkt even belangrijk.
  - Er is een tool gekocht of gebouwd, maar niemand gebruikt hem.
  - De rekening van je AI-abonnementen loopt op, en je weet niet goed waarom.
  - Je wil een website met AI bouwen, maar je weet niet hoe je dat onder controle houdt.
  - Elke prompt begint weer vanaf nul en je bespaart er eigenlijk weinig tijd mee.
questions:
  title: Hoe we van start gaan met AI
  items:
  - De juiste tools en modellen kiezen
  - Skills maken op maat van je team
  - Automatisatie voor het werk dat steeds terugkomt
  - Richtlijnen zodat AI jouw designs en schrijfstijl volgt
  - Social media content in je eigen stem
  - Een 'human in the loop' waar nodig
  - Verkennen waar eigen tools wel of niet nuttig zijn
  - Richtlijnen en limieten om de kosten te beperken
consequences:
  title: Waarom is correcte implementatie zo belangrijk?
  lead: Zonder afspraken heeft AI in marketing eerder een negatieve dan een positieve invloed.
  items:
  - title: Alles klinkt hetzelfde
    text: Zonder richtlijnen schrijft AI zoals het hele internet schrijft. Je teksten en visuals lijken dan op die van je concurrent en de winkel om de hoek, en je klant ziet het verschil niet meer.
  - title: Tools en dashboards blijven liggen
    text: Je kan tegenwoordig alles maken, dus begin je er gewoon aan. Maar blijf je die tool gebruiken? En heeft het eigenlijk nut, of is het gewoon een extra inbox of dashboard dat je tijd kost?
  - title: Een hoge rekening
    text: Wie voor elke taak het zwaarste model kiest, betaalt voor denkkracht die eenvoudig tekstwerk niet nodig heeft. Het werk gaat er ook niet sneller door.
# Three stages, Kjell 2026-10-21. Very Klear is the one you talk to about
# implementing; the AI-geletterdheid training for groups is a partner's.
stages:
  title: Hoe we AI implementeren op maat van je bedrijf?
  lead: Hoe ver sta je al met AI? Eerste babystapjes of durf je al eens loslaten?
  items:
  - name: Nog geen AI
    situation: Je gebruikt nog geen AI, of misschien nu en dan eens ChatGPT in plaats van Google.
    what:
    - We gaan eerst praten over waar je vandaag tijd verliest, pas daarna over tools
    - We brengen je maandelijks budget en de mogelijkheden in kaart
    - We maken afspraken over welke gegevens erin mogen en welke niet
    - Indien gewenst organiseren we een opleiding AI-geletterdheid voor je team, rond veilig gebruik
  - name: Je kent het verschil tussen Gemini en Mistral
    situation: Je hebt ChatGPT, Copilot of Claude, maar het blijft bij losse vragen.
    what:
    - Skills installeren voor het werk dat steeds terugkomt
    - Goede gewoontes, van hoe je vraagt tot hoe je de output controleert
    - Je tools aan elkaar koppelen, zoals mail, agenda, documenten en CRM
    - Vaste instructies, zodat iedereen in je team hetzelfde resultaat krijgt
  - name: Claude is je beste vriend
    situation: AI zit al elke dag in je werk, en je wil er meer uit halen.
    what:
    - Wat je nog kan automatiseren, en waar een mens moet blijven meekijken
    - Waar de gaten zitten in je werkwijze en je tools
    - Betere kwaliteit van je leads, je content en je designs
    - Waar je op tokenkosten kan besparen
    - Analyse van je interne tools en wat nog zin heeft om te bouwen

approach:
  title: Hoe gaan we te werk?
  steps:
  - title: Waar sta je nu?
    text: Welke tools je team gebruikt, wat per persoon verschilt, welke taak elke week terugkomt en welke data al klopt. Zo zien we snel waar AI helpt en waar niet.
  - title: Hebben we dit echt nodig?
    text: Per taak een eerlijke keuze tussen AI, een eenvoudige automatisering of mensenwerk. Voor we iets bouwen, weten we welk bestaand werk het vervangt en wie het straks onderhoudt. Je hebt AI zeker niet voor alles nodig.
  - title: We bouwen het mee
    text: De beste tools bouw je zij aan zij met de gebruikers. Stap voor stap werken we aan nieuwe automatisaties, dashboards en campagnes, tot alles netjes op maat werkt.
deliver:
  title: Wat je krijgt
  text: Een AI-marketingstrategie op jouw niveau. Van goed ingestelde tools en richtlijnen voor je stijl tot een interne tool of een systeem dat effectief draait.

# The AI-specific block: what AI does, what stays with you.
split:
  ai_title: Wat AI doet
  ai: Voorbereiden, samenvatten, opvolgen, eerste versies schrijven en het werk dat elke week terugkomt. Ook een zorgvuldige blogpost of nieuwsbrief.
  you_title: Wat bij jou blijft
  you: 'Het verkoopgesprek zelf, de lastige mail en de keuzes. En elk kort persoonlijk bericht: dat schrijf je zelf sneller, en dat moet persoonlijk blijven.'
  never_title: Wat we nooit volledig automatiseren
  never:
  - Een antwoord aan een ontevreden klant
  - Een offerte met een prijs erin
  - Het bericht na een moeilijk gesprek
  - Het verkoopgesprek zelf

transformation:
  title: Hoe ziet dat eruit?
  lead: Wat er verandert als AI een vaste plaats krijgt in je marketing.
  before_title: Vandaag
  before:
  - Iedereen gebruikt AI een beetje zoals Google.
  - Teksten uit AI klinken als die van iedereen.
  - Visuals zijn druk en alles vraagt evenveel aandacht.
  - Je denkt niet na over modellen en betaalt te veel.
  - AI wordt nergens structureel ingezet.
  after_title: Straks
  after:
  - Je team werkt met dezelfde instructies en krijgt hetzelfde resultaat.
  - Je content klinkt als jouw bedrijf, omdat AI je verhaal en je schrijfstijl kent.
  - Visuals tonen eerst wat telt, met witruimte en passende kleuren.
  - Een licht model doet het eenvoudige werk, een zwaarder de rest, en de rekening blijft betaalbaar.
  - Dat werk loopt vanzelf, maar jij behoudt controle.

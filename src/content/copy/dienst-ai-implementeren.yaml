faq:
  title: Vragen over AI implementeren in marketing
  items:
  - q: Wat bedoelen jullie met marketing engineering?
    a: Dat we niet enkel advies geven, maar zelf mee bouwen in je tools, naast je team. Een ingenieur ter plaatse, maar dan voor marketing en verkoop.
  - q: Met welke AI-tools begin je in marketing?
    a: Met wat je al hebt, en met wat je ermee wil doen. Werk je in Microsoft 365, dan ligt Copilot voor de hand. Voor schrijven en analyse werken we zelf vooral met Claude. We zeggen eerlijk wat bij jou past, ook als dat het goedkopere is. Is er toch iets nieuws nodig, dan zeggen we waarom en wat het kost.
  - q: Welk AI-model gebruik je voor marketing?
    a: Voor elke taak het model dat past. Een snel en goedkoop model zoals Claude Haiku volstaat voor eenvoudig tekstwerk, zoals samenvatten, sorteren en omzetten. Een middenmodel zoals Claude Sonnet doet het meeste dagelijkse werk. Het zwaarste model met de meeste denktijd heb je zelden nodig, en net daar loopt de rekening op.
  - q: Hoe zorg je dat AI-content klinkt als je eigen bedrijf?
    a: Met een helder verhaal en strikte richtlijnen. We schrijven je verhaal, je schrijfstijl en je design uit in vaste instructies die AI elke keer meekrijgt. Zonder die basis schrijft AI zoals iedereen, en daarom begint het vaak bij positionering.
  - q: Wat automatiseer je beter niet met AI?
    a: Een kort persoonlijk bericht schrijf je zelf sneller dan je het met AI bijschaaft. En hoe meer AI er rondgaat, hoe meer mensen persoonlijk contact waarderen. AI is er voor het werk dat terugkomt en voor een zorgvuldig bericht aan veel mensen tegelijk. Een antwoord aan een ontevreden klant of een offerte met een prijs blijft mensenwerk.
  - q: Kan je een website bouwen met AI?
    a: "Ja, en dat hoeft geen gok te zijn. AI schrijft de code, maar je kan elk bestand nalezen. Wat het doet mislukken, is te weinig voorbereiding. Daarom houden we de werkmap en de site apart, met versiebeheer vanaf dag één. Er is één centraal bestand met instructies en een uitgeschreven design. Wijzigingen zijn klein en we kijken ze één voor één na. Voor het onderhoud stellen vaste routines wijzigingen voor, en jij keurt ze goed. Zo is de site van Willow gebouwd: meer dan 500 pagina's, even goed gevonden in Google en sneller dan voordien."
  - q: AI, is dat niet iets voor grote bedrijven?
    a: Integendeel. Hoe kleiner je bedrijf, hoe makkelijker je ermee aan de slag kan. Zelfs met €100 per maand kom je trouwens al heel ver.
  - q: Is onze data veilig?
    a: Dat is een van de eerste dingen die we bekijken. Welke data gaat waar naartoe, en wat hoort daar niet thuis. Waar het zwaarder wordt, werken we met een cybersecurity partner.
  - q: Geven jullie ook een AI-opleiding aan ons team?
    a: 'Een opleiding AI-geletterdheid voor groepen doen we met een partner. Wij doen daarna de invoering zelf: tools instellen, richtlijnen schrijven en mee bouwen in je werk.'
  - q: Wat kost een AI-traject?
    a: Dat hangt af van wat je zoekt. We bespreken het na de strategiesessie, met een duidelijke scope.

meta:
  title: AI implementeren · Very Klear
  description: AI aan het werk zetten waar het echt helpt, in marketing, sales en klantencontact. En duidelijk maken wat beter mensenwerk blijft.

hero:
  title_html: AI implementeren.<br />Waar het echt werk scheelt.
  lead: AI aan het werk zetten waar het echt helpt, in marketing, sales en klantencontact. En duidelijk maken wat beter mensenwerk blijft, zodat je contact met klanten beter wordt in plaats van automatisch.
  button: Plan een strategiesessie

when:
  title: Je zit hier als
  items:
    - Iedereen in je team gebruikt AI, maar elk anders.
    - Je weet niet of de info die eruit komt klopt.
    - Dezelfde taak komt elke week terug en vreet tijd.
    - De factuur voor tools loopt op, en niemand weet waarvoor.

questions:
  title: Wat we samen bouwen
  items:
    - Eén manier van werken voor het hele team
    - Data die klopt voor ze erin gaat
    - Geen ruis, geen onnodige kosten
    - Script waar het kan, AI waar het moet
    - Voorbereiding van verkoopgesprekken
    - Opvolging die niet vergeten wordt

approach:
  title: Hoe het verloopt
  steps:
    - title: Waar loopt het vast?
      text: Wat nu per persoon of per tool verschilt, en welke taak elke week terugkomt. De offerte die telkens opnieuw getypt wordt, de klant die niemand terugbelde.
    - title: AI, script of mensenwerk
      text: Per taak een eerlijke keuze. Veel heeft geen AI nodig, een gewoon script volstaat. En sommige dingen blijven beter bij jou.
    - title: Eén toepassing die draait
      text: We bouwen de eerste toepassing echt, in de tools die je al gebruikt, en kijken wat ze opleverde.

deliver:
  title: Wat je krijgt
  text: Een helder overzicht van wat AI nodig heeft, wat een script volstaat en wat manueel blijft, plus één toepassing die effectief draait.

# The AI-specific block: what AI does, what stays with you.
split:
  ai_title: AI doet
  ai: Voorbereiden, samenvatten, opvolgen, het werk dat elke week terugkomt.
  you_title: Jij doet
  you: Het verkoopgesprek zelf, de lastige mail, alles waar je eigen stem in zit.
  never_title: Wat we nooit automatiseren
  never:
    - Een antwoord aan een ontevreden klant
    - Een offerte met een prijs erin
    - Het bericht na een moeilijk gesprek
    - Het verkoopgesprek zelf

leads_to:

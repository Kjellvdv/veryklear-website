# Three stages: where a business stands with AI decides what's worth doing.
# Three stages, Kjell 2026-10-21. Very Klear is the one you talk to about
# implementing; the AI-geletterdheid training for groups is a partner's.
stages:
  title: Wat we doen, waar je ook staat.
  lead: Wat zinvol is, hangt af van hoe ver je al staat met AI. Je hoeft niet bij het begin te starten.
  items:
    - name: Nog geen AI
      situation: Je gebruikt nog geen AI, of enkel eens ChatGPT voor een mailtje.
      what:
        - Eerst praten over wat je vandaag tijd kost, pas daarna over tools
        - De juiste tools voor wat jij nodig hebt, en wat ze kosten
        - Afspraken over welke gegevens erin mogen en welke niet
        - Een opleiding AI-geletterdheid voor je team, via een partner, over hoe AI werkt en hoe je het veilig gebruikt. Wij helpen bij de invoering zelf.
    - name: Net begonnen
      situation: Je hebt ChatGPT, Copilot of Claude, maar het blijft bij losse vragen.
      what:
        - Skills installeren voor het werk dat steeds terugkomt
        - Goede gewoontes, van hoe je vraagt tot hoe je controleert
        - Je tools aan elkaar koppelen, zoals mail, agenda, documenten en CRM
        - Vaste instructies, zodat iedereen in je team hetzelfde resultaat krijgt
    - name: Dagelijks met AI
      situation: AI zit al elke dag in je werk, en je wil er meer uit halen.
      what:
        - Wat je nog kan automatiseren, en waar een mens moet blijven meekijken
        - Waar de gaten zitten in je werkwijze en je tools
        - Betere kwaliteit van je leads, je content en je designs
        - Waar je op tokenkosten kan besparen
        - Interne tools en systemen die we mee bouwen

approach:
  title: Hoe het verloopt
  steps:
    - title: Waar sta je, waar loopt het vast?
      text: Welke tools en modellen je team nu gebruikt, wat per persoon verschilt, en welke taak elke week terugkomt.
    - title: AI, script of mensenwerk
      text: Per taak een eerlijke keuze. Veel heeft geen AI nodig, een gewoon script volstaat. En sommige dingen blijven beter bij jou.
    - title: We bouwen het mee
      text: In de tools die je al gebruikt, naast je team. Geen rapport om zelf uit te voeren, maar iets dat draait en waarvan je ziet wat het opbrengt.

deliver:
  title: Wat je krijgt
  text: Een plan op jouw niveau, en wat erin staat ook gebouwd. Van een goed ingestelde Claude of Copilot tot een interne tool of een systeem dat effectief draait.


# Three stages: where a business stands with AI decides what's worth doing.
stages:
  title: Waar sta je met AI?
  lead: Wat zinvol is, hangt af van waar je vandaag staat. Je hoeft niet bij het begin te starten.
  items:
    - name: Nog geen AI
      situation: Niemand in je team gebruikt AI, of enkel eens ChatGPT voor een mailtje.
      what:
        - Welk model past bij wat je doet, en wat het kost
        - Accounts en instellingen die voor iedereen hetzelfde zijn
        - Afspraken over welke gegevens erin mogen en welke niet
        - Twee of drie taken waar je meteen tijd mee wint
    - name: Eerste stappen
      situation: Je hebt Copilot of Claude, maar het blijft bij losse vragen in een chatvenster.
      what:
        - Projecten met vaste instructies, zodat iedereen hetzelfde resultaat krijgt
        - Je eigen documenten en huisstijl gekoppeld
        - Vaste werkwijzen voor wat terugkomt, zoals verslagen of offertes voorbereiden
        - De eerste taken die Claude Cowork zelf afwerkt
    - name: Gevorderd
      situation: AI zit al in je werk, en je wil dat het meer doet dan helpen typen.
      what:
        - Content in je eigen stem, van artikels tot LinkedIn en nieuwsbrieven
        - Interne tools, zoals een dashboard, een calculator of een klantoverzicht
        - CRM, opvolging en leadlijsten die zichzelf bijhouden
        - Met een GTM engineering partner, als het technischer wordt

approach:
  title: Hoe het verloopt
  steps:
    - title: Waar sta je, waar loopt het vast?
      text: Welke tools en modellen je team nu gebruikt, wat per persoon verschilt, en welke taak elke week terugkomt.
    - title: AI, script of mensenwerk
      text: Per taak een eerlijke keuze. Veel heeft geen AI nodig, een gewoon script volstaat. En sommige dingen blijven beter bij jou.
    - title: We bouwen het mee
      text: In de tools die je al gebruikt, naast je team. Geen rapport om zelf uit te voeren, maar iets dat draait en waarvan je ziet wat het opbrengt.

deliver:
  title: Wat je krijgt
  text: Een plan op jouw niveau, en wat erin staat ook gebouwd. Van een goed ingestelde Claude of Copilot tot een interne tool of een systeem dat effectief draait.

# The AI-specific block: what AI does, what stays with you.

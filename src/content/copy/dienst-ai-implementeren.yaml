faq:
  title: Vragen over AI implementeren
  items:
    - q: Wat bedoelen jullie met marketing engineering?
      a: Dat we niet enkel advies geven, maar zelf mee bouwen in je tools, naast je team. Een ingenieur ter plaatse, maar dan voor marketing en verkoop.
    - q: Welk model moeten we nemen?
      a: Dat hangt af van wat je ermee doet en wat je al gebruikt. Werk je in Microsoft 365, dan ligt Copilot voor de hand. Voor schrijven en analyse werken we zelf vooral met Claude. We zeggen eerlijk wat bij jou past, ook als dat het goedkopere is.
    - q: AI, is dat niet iets voor grote bedrijven?
      a: Meestal niet. Een tool die je al betaalt, goed ingesteld, brengt je verder dan de meeste bedrijven ooit geraken. Een echt platform is pas nodig als je daar tegen de grenzen loopt.
    - q: Moeten we nieuwe tools kopen?
      a: Zelden. We beginnen met wat je al hebt. Is er toch iets nodig, dan zeggen we waarom en wat het kost.
    - q: Is onze data veilig?
      a: Dat is een van de eerste dingen die we bekijken. Welke data gaat waar naartoe, en wat hoort daar niet thuis. Waar het zwaarder wordt, werken we met een cybersecurity partner.
    - q: Wat kost het?
      a: Dat hangt af van wat er nodig is. We bespreken het na de strategiesessie, met een duidelijke scope.

articles:

meta:
  title: AI implementeren | Very Klear Marketing Agency
  description: AI in je marketing, zonder je identiteit te verliezen. Van de juiste tools kiezen tot content, interne tools en systemen die we mee bouwen.

hero:
  title_html: AI implementeren.<br />Sneller, en toch helemaal jij.
  lead: Iedereen gebruikt AI, en het ziet er allemaal hetzelfde uit. Met een helder verhaal en duidelijke richtlijnen respecteert AI jouw designs en schrijfstijl. Wij zetten het op, van de eerste tools tot systemen die zelf draaien.
  button: Plan een strategiesessie

when:
  title: Herkenbaar?
  items:
  - Je weet niet met welke tools en processen je moet beginnen.
  - Iedereen in je team gebruikt AI, maar elk op zijn eigen manier.
  - Wat eruit komt, klinkt niet als jou.
  - Dezelfde taak komt elke week terug en vreet tijd.
questions:
  title: Wat we samen bouwen
  items:
  - De juiste tools, goed ingesteld
  - Richtlijnen zodat AI jouw stijl volgt
  - Content in je eigen stem
  - Interne tools op maat
  - CRM en opvolging die zichzelf bijhouden
  - Automatisering waar het kan, mensenwerk waar het moet
# Three stages, Kjell 2026-10-21. Very Klear is the one you talk to about
# implementing; the AI-geletterdheid training for groups is a partner's.
stages:
  title: Wat we doen, waar je ook staat.
  lead: Hoe ver sta je al met AI? Je hoeft niet bij het begin te starten.
  items:
  - name: Nog geen AI
    situation: Je gebruikt nog geen AI, of enkel eens ChatGPT voor een mailtje.
    what:
    - Eerst praten over wat je vandaag tijd kost, pas daarna over tools
    - De juiste tools voor wat jij nodig hebt, en wat ze kosten
    - Afspraken over welke gegevens erin mogen en welke niet
    - Een opleiding AI-geletterdheid voor je team, via een partner, over hoe AI werkt en hoe je het veilig gebruikt. Wij helpen bij de invoering zelf.
  - name: Net begonnen
    situation: Je hebt ChatGPT, Copilot of Claude, maar het blijft bij losse vragen.
    what:
    - Skills installeren voor het werk dat steeds terugkomt
    - Goede gewoontes, van hoe je vraagt tot hoe je controleert
    - Je tools aan elkaar koppelen, zoals mail, agenda, documenten en CRM
    - Vaste instructies, zodat iedereen in je team hetzelfde resultaat krijgt
  - name: Dagelijks met AI
    situation: AI zit al elke dag in je werk, en je wil er meer uit halen.
    what:
    - Wat je nog kan automatiseren, en waar een mens moet blijven meekijken
    - Waar de gaten zitten in je werkwijze en je tools
    - Betere kwaliteit van je leads, je content en je designs
    - Waar je op tokenkosten kan besparen
    - Interne tools en systemen die we mee bouwen

approach:
  title: Hoe gaan we te werk?
  steps:
  - title: Waar sta je nu?
    text: Welke tools je team gebruikt, wat per persoon verschilt, en welke taak elke week terugkomt.
  - title: AI, automatisering of mensenwerk
    text: Per taak een eerlijke keuze. Veel heeft geen AI nodig, een eenvoudige automatisering volstaat. En sommige dingen blijven beter bij jou.
  - title: We bouwen het mee
    text: In de tools die je al gebruikt, naast je team. Geen rapport om zelf uit te voeren, maar iets dat draait en waarvan je ziet wat het opbrengt.

deliver:
  title: Wat je krijgt
  text: Een plan op jouw niveau, en wat erin staat ook gebouwd. Van goed ingestelde tools tot een interne tool of een systeem dat effectief draait.

# The AI-specific block: what AI does, what stays with you.
split:

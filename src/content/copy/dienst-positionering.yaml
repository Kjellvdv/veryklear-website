  keys: [design, fotografie]

faq:
  title: Vragen over positionering
  items:
  - q: Wat is een positioneringstraject?
    a: Een begeleiding van enkele weken waarin we het verhaal van je bedrijf uitwerken of scherpstellen. We zoeken uit in welke markt je speelt, wie je ideale klant is en waarom die voor jou kiest. We vertrekken bij gesprekken met je beste klanten en gebruiken het verhaal daarna in de praktijk.
  - q: Moet ik echt hier beginnen?
    a: Meestal wel. Marketingstrategie en AI bouwen verder op je verhaal. Zonder duidelijkheid hier, verlies je tijd en geld aan andere campagnes.
  - q: Is dit niet gewoon een nieuwe slogan?
    a: Nee. Een slogan komt pas helemaal op het einde, als dat al nodig is. Dit gaat over wie je klant is en waarom die voor jou kiest. De rest volgt daaruit.
  - q: Hoe lang duurt het?
    a: Enkele weken. Een basis kan er snel zijn, de rest hangt vooral af van hoe snel je input en feedback geeft ;)
  - q: Wat kost een positioneringstraject?
    a: Dat hangt af van wat je zoekt en waar je nu al staat. We bespreken het best in een strategiesessie.


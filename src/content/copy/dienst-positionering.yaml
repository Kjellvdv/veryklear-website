meta:
  title: Positioneringstraject | Very Klear Marketing Agency
  description: 'Een positioneringstraject zet de positionering van je bedrijf op punt: in welke markt je speelt, wie je ideale klant is en waarom die voor jou kiest.'

hero:
  title_html: Positionering.<br />Alles begint bij een helder verhaal.
  lead: Waarom kiezen klanten voor jou? Wie wil je nog bereiken? En hoe vertel je dat zo dat het blijft hangen? In een positioneringstraject zoeken we het samen uit, zodat je website, je content en ook AI hetzelfde verhaal vertellen.
  button: Plan een strategiesessie

when:
  title: Herkenbaar?
  items:
  - Je kan niet in één zin zeggen waarom klanten voor jou kiezen.
  - Je herschrijft je site, maar het voelt nooit juist.
  - Klanten komen via via, maar je weet niet goed waarom.
  - Wat je maakt is technisch, en uitleggen lukt niet in een paar woorden.
  - Je start iets nieuws en wil het meteen goed zetten.
questions:
  title: Wat we samen uitzoeken
  items:
  - In welke markt speel je echt?
  - Met wie word je vergeleken?
  - Wie is je ideale klant?
  - Wat wil die klant echt?
  - Wat maakt je anders?
  - Waarom kiest die voor jou?
consequences:
  title: En wat doet dat met je bedrijf?
  lead: Zolang je verhaal niet op punt staat, draait alles een beetje harder dan nodig.
  items:
  - title: Via via blijft de enige motor
    text: Je beste klanten vinden je wel, maar je kan niet uitleggen waarom. Dus kan je het ook niet vertellen aan mensen die je nog niet kennen.
  - title: Elke tekst begint van nul
    text: 'Je site, een offerte, een presentatie: telkens zoek je opnieuw naar de juiste woorden. En elke versie klinkt een beetje anders.'
  - title: AI maakt het nog algemener
    text: Wie AI een tekst laat schrijven zonder duidelijk verhaal, krijgt wat iedereen krijgt. Het leest vlot, maar het klinkt niet als jij.
approach:
  title: Hoe gaan we te werk?
  steps:
  - title: We bellen je beste klanten
    text: Een paar korte gesprekken met klanten die graag met je werken. Wat wilden ze oplossen, wat probeerden ze eerder, en wanneer wisten ze dat het werkte? Daar zit het antwoord meestal al.
  - title: Je verhaal op één blad
    text: In welke markt je speelt, wie je klant is en wat je belooft, kort genoeg om te onthouden. Die eerste versie is er snel, zodat we ze meteen kunnen testen.
  - title: Testen en bijsturen
    text: We gebruiken het verhaal in teksten en gesprekken, kijken wat het doet en passen aan. Met vaste momenten samen, over enkele weken tot een paar maanden.

deliver:
  title: Wat je krijgt
  text: Een helder verhaal op één blad, en richtlijnen waarmee je team en je AI-tools het ook zo vertellen. Een werkdocument dat mee evolueert, geen rapport voor de lade.

transformation:
  title: Hoe ziet het eruit als je verhaal klopt?
  before_title: Vandaag
  before:
  - Klanten komen via via, en je weet niet goed waarom.
  - Je legt in elk gesprek opnieuw uit wat je doet.
  - Je site zegt een beetje van alles.
  - Elke tekst begint bij een leeg blad.
  - AI schrijft vlot, maar niet zoals jij.
  after_title: Na het traject
  after:
  - Je weet waarom ze kiezen, en je vertelt dat ook aan wie je nog niet kent.
  - Je zegt in één zin waarom klanten voor jou kiezen.
  - Je site spreekt de klant aan die je echt wil bereiken.
  - Je team vertrekt van één blad en vertelt hetzelfde verhaal.
  - AI schrijft in jouw stijl, omdat het je verhaal kent.
mid_cta:
  title: Benieuwd waar jouw verhaal nu staat?
  text: In een strategiesessie van een uurtje kijken we samen naar je verhaal. En we zeggen eerlijk of een positioneringstraject je eerste stap is.
  button: Plan een strategiesessie

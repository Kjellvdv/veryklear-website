faq:
  title: Vragen over positionering
  items:
  - q: Wat is een positioneringstraject?
    a: Een begeleiding van enkele weken tot een paar maanden waarin we de positionering van je bedrijf uitwerken. We zoeken uit in welke markt je speelt, wie je ideale klant is en waarom die voor jou kiest. We vertrekken bij gesprekken met je beste klanten en testen het verhaal daarna in de praktijk.
  - q: Moet ik echt hier beginnen?
    a: Meestal wel. Marketingstrategie en AI bouwen verder op je verhaal. Staat dat al, dan zeggen we het in de strategiesessie en starten we ergens anders.
  - q: Is dit niet gewoon een nieuwe slogan?
    a: Nee. Een slogan komt pas helemaal op het einde, als hij al nodig is. Dit gaat over wie je klant is en waarom die kiest. De rest volgt daaruit.
  - q: Hoe lang duurt het?
    a: Enkele weken tot een paar maanden. Het eerste blad is er snel, de rest hangt vooral af van hoe snel je input en feedback geeft ;)
  - q: Wat kost een positioneringstraject?
    a: Dat hangt af van wat je zoekt. We bespreken het na de strategiesessie, met een duidelijke scope.


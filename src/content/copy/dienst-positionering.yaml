meta:
  title: Positioneringstraject | Very Klear Marketing Agency
  description: 'Een positioneringstraject zet de positionering van je bedrijf op punt: in welke markt je speelt, wie je ideale klant is en waarom die voor jou kiest.'

hero:
  title_html: Positionering.<br />Alles begint bij een helder verhaal.
  lead: Waarom kiezen klanten voor jou? Wie wil je nog bereiken? En hoe vertel je dat zo dat het blijft hangen? In een positioneringstraject zoeken we het samen uit, zodat je website, je content en ook alles dat je met AI doet hetzelfde verhaal vertellen.
  button: Plan een strategiesessie

when:
  title: Herkenbaar?
  items:
  - Je hebt altijd een andere uitleg voor wat je precies doet.
  - Je herschrijft je site, maar het voelt nooit juist.
  - Klanten komen via via, maar je weet niet goed waarom.
  - Wat je maakt is technisch, en uitleggen lukt niet in een paar woorden.
  - Iedereen in je sector vertelt ongeveer hetzelfde verhaal, ook jij.
questions:
  title: Wat we samen uitzoeken
  items:
  - Met wie word je vergeleken?
  - Wie is je ideale klant?
  - Waarom komt die klant precies bij jou?
  - Wat verwacht zo'n klant van je bedrijf?
  - Wat maakt je anders?
  - Hoe zet je dat om in woorden?
consequences:
  title: En wat doet dat met je bedrijf?
  lead: Groei gaat trager dan verwacht. Je blijft experimenteren maar vindt geen antwoord. Je verliest tijd aan zaken die er niet toe doen.
  items:
  - title: Je verspilt geld aan marketingcampagnes die misschien wel of niet gaan werken.
    text: Iedereen maakt TikTok-video's dus jij ook? Samen een dansje plaatsen zorgt misschien voor likes. Maar zijn dat wel de mensen die je wil bereiken?
  - title: Elke tekst begint van nul
    text: 'Voor elke webpagina, offerte of presentatie moet je opnieuw zoeken naar de juiste woorden. En elke versie klinkt een beetje anders.'
  - title: Niemand weet precies wat je doet
    text: Er komen te weinig aanvragen of zelfs aanvragen die helemaal niet relevant zijn, want het is niet duidelijk wat jullie wel en niet doen.
approach:
  title: Hoe gaan we te werk?
  steps:
  - title: We nemen contact op met je beste klanten
    text: Een paar korte gesprekken met klanten die graag met je werken, leert ons veel over wat ze wilden oplossen, welke alternatieven ze overwogen, en waarom ze precies voor jou kiezen.
  - title: Een diepgaand gesprek
    text: Wat vind je zelf belangrijk en hoe wil je in beeld gebracht worden? Moet het serieus of mag er een hoekje af zijn?
  - title: Alles samenbrengen
    text: We brengen alle inzichten samen en gaan verder op zoek naar wat er leeft in je sector. Wat zoeken mensen? Wat maakt jou uniek?

deliver:
  title: Wat je krijgt
  text: Een helder verhaal op één blad met richtlijnen zodat je team (en je AI-tools) altijd hetzelfde verhaal vertellen.

transformation:
  title: Hoe ziet het eruit als je verhaal klopt?
  before_title: Vandaag
  before:
  - Klanten komen via via, en je weet niet goed waarom.
  - Je legt in elk gesprek anders uit wat je doet.
  - Je site zegt een beetje van alles.
  - Elke tekst begint bij een leeg blad.
  - AI schrijft vlot, maar het klinkt niet zoals je wil.
  after_title: Na het traject
  after:
  - Je weet waarom ze kiezen en kan erop verder bouwen.
  - Je zegt in één zin waarom klanten voor jou kiezen.
  - Je site spreekt de klant aan die je echt wil bereiken.
  - Je team vertrekt van één blad en vertelt hetzelfde verhaal.
  - AI schrijft in jouw stijl, omdat het je verhaal kent.
mid_cta:
  title: Benieuwd waar jouw verhaal nu staat?
  text: In een strategiesessie van een uurtje kijken we samen naar je verhaal. En we zeggen eerlijk wat een positioneringstraject voor je kan betekenen.
  button: Plan een strategiesessie
leads_to:
  title: En daarna?
  items:
  - title: Van verhaal naar concrete teksten
    text: Met templates en AI skills zorgen we ervoor dat je verhaal overal consistent blijft, van persbericht tot social media post.
  - title: Een nieuwe website
    text: We passen je teksten aan of maken een volledig nieuwe site, al dan niet met een designpartner.
    href: /partners
  - title: Betere salesdocumenten
    text: We zetten je folders, klantverhalen en andere promomaterialen op punt.
  - title: Marketingstrategie
    text: Zet je scherpere verhaal om in een strategie die beter past bij je bedrijf en je ideale klant.
    href: /marketing-strategie


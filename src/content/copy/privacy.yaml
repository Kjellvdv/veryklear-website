# Keep this factual and in line with what the site actually does. If the site
# ever adds cookies, a script that measures, or another form service, update this page
# first. The visit counting it describes is server/count.ts; keep the two in step.
# Company details come from site.yaml (footer).

meta:
  title: Privacy · Very Klear
  description: Welke gegevens Very Klear verwerkt via deze website, waarom, en wat je rechten zijn.

hero:
  title: Privacy.
  lead: Kort en concreet. Deze site verzamelt zo weinig mogelijk, en wat je ons stuurt gebruiken we enkel om je te antwoorden.

updated: Laatst bijgewerkt op 14 oktober 2026.

sections:
  - title: Wie is verantwoordelijk
    body: Very Klear is verantwoordelijk voor de verwerking van je gegevens via deze website. Je vindt onze contactgegevens onderaan deze pagina.
  - title: Wat we verzamelen
    body: Wat je zelf invult in het contactformulier, of wat je ons mailt. Dat is je naam, je bedrijf, je e-mailadres, het onderwerp en je bericht. Bij een bericht via het formulier komen je IP-adres en browsertype mee in de mail. Van elk bezoek houden we daarnaast bij welke pagina je bekijkt, van welke site of pagina je komt, het soort toestel en de taal van je browser.
  - title: Waarom
    body: Om je vraag te beantwoorden en een eventueel gesprek of voorstel op te volgen. Je IP-adres en browsertype gebruiken we enkel om misbruik van het formulier te herkennen. De bezoekcijfers gebruiken we om te zien welke pagina's en kanalen werken, hoe bezoekers zich door de site bewegen, en om de site te verbeteren. Dat doen we op basis van ons gerechtvaardigd belang om te weten of de site zijn werk doet. We gebruiken je gegevens niet voor nieuwsbrieven of reclame, en we verkopen ze aan niemand.
  - title: Wie ze nog ziet
    body: Het contactformulier stuurt je bericht rechtstreeks naar onze eigen mailserver, zonder tussenpartij. De site zelf draait bij hostingbedrijf Railway, op een server in Amsterdam. Zoals elke webhost kan Railway technische gegevens zoals je IP-adres kort bijhouden om de site veilig te houden. Meer niet.
  - title: Cookies en tracking
    body: Deze site gebruikt geen cookies en laadt geen meetscript. Onze bezoekcijfers tellen we op onze eigen server, uit de aanvraag die je browser toch al doet om een pagina te openen. Je IP-adres bewaren we daarbij niet. We gebruiken het enkel op het moment zelf, om bezoeken van robots op servers in datacenters niet mee te tellen en om een afkorting te maken die elke dag verandert. Met die afkorting tellen we je binnen één dag niet dubbel en zien we in welke volgorde je pagina's bekijkt, maar we kunnen je niet van dag tot dag volgen. Staat Do Not Track of Global Privacy Control aan in je browser, dan tellen we je bezoek niet mee. Het lettertype staat op onze eigen server, zodat er bij een bezoek geen gegevens naar Google of andere partijen gaan. Enkel op de pagina om een strategiesessie in te plannen laden we de agenda van TidyCal. Plan je een moment in, dan verwerkt TidyCal je naam, e-mailadres en het gekozen tijdstip.
  - title: Hoe lang we ze bewaren
    body: Je bericht bewaren we zolang nodig om je vraag op te volgen. Word je klant, dan bewaren we wat nodig is voor de samenwerking en de boekhouding, zo lang als de wet dat vraagt. De bezoekcijfers wissen we na 14 maanden.
  - title: Je rechten
    body: Je kan altijd vragen welke gegevens we van je hebben, ze laten aanpassen of laten wissen. Stuur daarvoor een mail. Ben je niet tevreden met hoe we ermee omgaan, dan kan je terecht bij de Gegevensbeschermingsautoriteit (gegevensbeschermingsautoriteit.be).


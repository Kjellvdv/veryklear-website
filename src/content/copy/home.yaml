faq:
  title: Wat we af en toe eens horen
  button: Stel je eigen vraag
  items:
  - q: Voor wie werken jullie?
    a: Voor bedrijven in Vlaanderen die willen groeien en het deftig willen doen. Technische bedrijven passen het best. Wie iets maakt of verkoopt dat wat uitleg vraagt, heeft het meest aan onze achtergrond.
  - q: We krijgen al ons werk via via. Hebben wij dat wel nodig?
    a: Mond-tot-mond is een goed kanaal, maar het is niet schaalbaar. De vraag is of je weet waarom het werkt, want dat vertelt je hoe je nog meer klanten kan krijgen.
  - q: AI, is dat niet iets voor grote bedrijven?
    a: Integendeel. Hoe kleiner je bedrijf, hoe makkelijker je ermee aan de slag kan. Zelfs met €100 per maand kom je trouwens al heel ver.
  - q: Wat kost een samenwerking?
    a: 'Dat hangt af van wat je zoekt en dat bespreken we na de strategiesessie, met een duidelijke scope. We zijn niet de goedkoopste maar zoals ze zeggen: "If you pay peanuts, you get monkeys."'
  - q: Wat is het verschil tussen een project en in-house?
    a: Op projectbasis spreken we een duidelijke scope af en krijg je waarvoor je betaalt. In-house werken we elke week een dag (of twee) bij jou mee en volgen we op wat er die week nodig is. We implementeren ook steeds nieuwe systemen waar je verder op kan bouwen. Hiervoor betaal je een vaste prijs per maand.

# Closing red block. Leave out to use the default from site.yaml.
cta:
  heading: Even bellen?
  body: Graag wat meer info? Wil je uitzoeken of het een goede match zal zijn? Of gewoon eens een uurtje sparren over marketing? No problemo.

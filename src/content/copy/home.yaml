meta:
  title: Very Klear · positionering, marketing strategie en AI
  description: Marketing met technische diepgang. Positionering, marketing strategie en AI implementeren in je bedrijf.

hero:
  title_html: Marketing met technische diepgang.<br />Van positionering tot AI.
  lead: Nieuwe website? Doordachte content? Ondersteuning voor sales? Alles begint bij een helder verhaal. We brengen het samen in kaart en zetten de juiste tools op zodat ook AI jouw designs en schrijfstijl respecteert.
  button_primary: Plan een strategiesessie
  button_secondary: Bekijk onze diensten

problems:
  title: Waarom een helder verhaal zo belangrijk is
  items:
  - quote: '"Onze klanten komen via via, maar niemand weet eigenlijk waarom."'
    body: Via via werkt. Maar het is niet schaalbaar. Ontdek exact waarom klanten voor jou kiezen, zodat je dat verhaal breder kan vertellen.
    tag: Positionering
  - quote: '"We doen een beetje van alles, en niets lijkt echt te werken."'
    body: Zonder verhaal geen strategie. Wanneer je verhaal op punt staat, weet je ook wie je wil bereiken en hoe je dat best kan doen.
    tag: Marketing strategie
  - quote: '"AI? Dat ziet er allemaal hetzelfde uit."'
    body: Klopt. Omdat iedereen hetzelfde vraagt. Maar met een duidelijk verhaal en strikte richtlijnen krijg je beter en sneller resultaat.
    tag: AI implementeren

paths:
  title: Even testen of zetten we alle puntjes op de i?
  # Keep these two the same length: the two paths carry equal weight.
  project:
    label: Samen werken aan één project
    title: Een duidelijk doel bereiken
    body: Wil je je verhaal op punt zetten, marketing strategie uitwerken of AI implementeren?
    link: Naar de diensten →
  fractional:
    label: Wekelijks in-house meewerken
    title: Een externe head of marketing
    body: 'Elke week draaien we één of twee dagen mee om je volledige marketing te dragen met behulp van AI (en externe partners).'
    link: Naar in-house →

pillars:
  title: Waar beginnen we?
  link: Naar de diensten →
  items:
  - title: Positionering
    questions:
    - In welke markt speel je echt?
    - Wie is je ideale klant?
    - Waarom kiest die voor jou?
  - title: Marketing strategie
    questions:
    - Welke kanalen wel, en welke niet?
    - Veel content of veel diepgang?
    - Meer focus op sales, marketing of product?
  - title: AI implementeren
    questions:
    - Waar beginnen we?
    - Hoe kan ik marketing automatiseren?
    - Wat blijft beter mensenwerk?

statement:
  title: Geen full-time marketing team nodig?
  body: 'Op 1 of 2 dagen per week regelen we alles: van socials tot sales-ondersteuning en website.'
  # Facts must be true and checkable. No "seven years of AI".
  facts:
  - value: 7 jaar
    text: B2B tech marketing, van startups tot scale-ups
    # The number in this fact is counted from partners.yaml; {n} is replaced.
  - value: '{n} partners'
    text: vaste partners voor extra expertise
    href: /partners
  - value: 1 aanspreekpunt
    text: van het eerste gesprek tot de uitvoering

steps:
  title: Een samenwerking verkennen?
  items:
  - title: Boek een strategiesessie
    body: Vertel ons wat je zoekt, waar je vastzit, en waar je naartoe wil.
    meta: 60 minuten
  - title: Krijg een voorstel
    body: Als we de juiste partij zijn om je te helpen, stellen we de volgende stap voor.
    meta: Project of in-house
  - title: Start de samenwerking
    body: Zodra alles in orde is, gaan we van start. Wij werken snel dus zorg maar dat je mee kan.
    meta: We vliegen erin hé


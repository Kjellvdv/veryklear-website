# Booking page (www.veryklear.com/strategiesessie). The calendar itself is a Google
# Calendar booking page, embedded below the intro; its addresses are `booking_url`
# and `booking_embed` in site.yaml.
# Never show a price or "gratis" here (products.yml strategiesessie.price_status).

meta:
  title: Plan een strategiesessie | Very Klear Marketing Agency
  description: Kies een moment voor een strategiesessie van een uur met Very Klear.

# Title and intro at the top of the calendar card (the page has no hero).
intro:
  title: Plan een strategiesessie.
  lead: Een uur over wat nu werkt en wat niet. Kies hieronder een moment dat je past.

side:
  title: Wat je eruit haalt
  points:
    - 60 minuten, online of bij jou
    - Een richting waar je mee verder kan
    - Waar je best begint
    - Een eerlijk 'nee' als je ons niet nodig hebt
  question: Liever eerst een vraag stellen?
  question_link: Stuur een bericht →

# Read out by screen readers for the calendar frame.
frame_title: Agenda om een strategiesessie in te plannen
# Shown behind the calendar while Google's page loads, which can take a few seconds.
loading: Agenda laden…
# On small screens the calendar is not framed: a button opens Google's page itself,
# which loads faster and works with the stricter cookie settings of phones.
open_button: Kies een moment

# Shown if the calendar can't load (blocked frame, no connection).
fallback: Lukt het niet om de agenda te laden? Open ze dan rechtstreeks.
fallback_link: Open de agenda →

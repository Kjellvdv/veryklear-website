# Contact page copy (www.veryklear.com/contact).
# Change the text after the colon, keep the indentation.
# The e-mail address, street address and VAT number come from site.yaml (footer).

meta:
  title: Contact | Very Klear Marketing Agency
  description: Boek een strategiesessie of stuur een bericht naar Very Klear.

form:
  title: Stuur een bericht
  intro: Je krijgt een persoonlijk antwoord, geen automatische mail.
  name_label: Naam
  name_placeholder: Voornaam en naam
  company_label: Bedrijf
  company_placeholder: Naam van je zaak
  email_label: E-mail
  email_placeholder: jij@jouwzaak.be
  topics_label: Waarover gaat het?
  # The pillar names are added automatically in front of these.
  topics_extra:
  - In-house
  - Weet ik nog niet
  message_label: Waar ben je mee bezig?
  message_placeholder: Een paar zinnen volstaan. Wat loopt er goed, wat niet?
  message_hint: Hoe concreter, hoe nuttiger ons antwoord.
  submit: Verstuur
  sending: Versturen…
  # Pop-up after sending
  sent_ok_title: Bedankt, je bericht is verstuurd.
  sent_ok: Je hoort snel van ons.
  error_title: Dat lukte niet.
  error: Probeer het zo meteen opnieuw, of mail ons rechtstreeks op
  close: Sluiten

# The red card on the right. Never show a price or "gratis" here.
session:
  label: De aanbevolen eerste stap
  title: Strategiesessie
  body: Een uurtje, en je weet waar je best begint.
  points:
  - 60 minuten online overleggen
  - Een eerste richting waar je mee verder kan
  - Een concreet voorstel voor een samenwerking
  - Of een eerlijk 'nee' als er geen match is
  button: Kies een moment

practical:
  label: Praktisch
  email_label: E-mail
  phone_label: Telefoon
  address_label: Adres
  vat_label: BTW

after:
  title: Wat er na je bericht gebeurt.
  steps:
  - title: Antwoord
    text: Een eerste, persoonlijke reactie op wat je schreef.
  - title: Strategiesessie
    text: Een uurtje samen om te verkennen wat je zoekt, als het zinvol lijkt. Anders zeggen we dat meteen.
  - title: Voorstel
    text: Als we de juiste partij zijn, stellen we een project of in-house voor.

# Partners page copy (www.veryklear.com/partners), also used for the partner cards
# on the dienst pages and the diensten overview.
#
# Rules (from ~/brands/very-klear/gtm/products.yml):
# - No partner is named on the site (Kjell, 2026-10-14: "name none"). Leave `name` empty.
# - Never say where a partner is based.
# - Partners are the delivery behind the pillars and fractioneel, not a fourth pillar.

meta:
  title: Partners | Very Klear Marketing Agency
  description: Voor bijkomende noden werkt Very Klear met gespecialiseerde partners. Het denkwerk en het contact blijven bij ons.

hero:
  title_html: Bijkomende noden?<br />Dan werken we met partners.
  lead: Van design en fotografie tot GTM engineering, web platformen en cybersecurity. Het denkwerk en het contact blijven bij ons, de expertise besteden we uit.

how:
  title: Hoe werkt dat?
  items:
  - title: Eén aanspreekpunt
    text: Je praat met ons, van het eerste gesprek tot de oplevering. De partner doet waar die goed in is.
  - title: Pas als het nodig is
    text: Een partner komt erbij als een dienst of een in-house samenwerking uitwijst dat er extra expertise nodig is.
  - title: Goed in één ding
    text: Vaste partners, elk gekozen voor één vak. Zo hoef je zelf niet te zoeken wie wat kan.

list_title: Onze partners
# Order here is the order on the page. `name` stays empty: categories only.
items:
  design:
    title: Design
    text: Logo, huisstijl, visitekaartjes, stickers... Alles wat je liever niet met Canva of AI maakt.
    name: ''
  fotografie:
    title: Fotografie
    text: Portretten en fotoshoots (op kantoor). Echte beelden van je zaak en je mensen, ideaal voor socials en websites.
    name: ''
  linkedin:
    title: Sociale media
    text: Contentautomatisatie en planning voor LinkedIn, Facebook en Instagram.
    name: ''
  social_content:
    title: Video content
    text: Posts, reels en stories voor Instagram en Facebook, als onderdeel van een groter plan.
    name: ''
  platform:
    title: Platform
    text: Complexere websites en apps, of een site op het platform dat je al gebruikt.
    name: ''
  gtm_engineering:
    title: GTM engineering
    text: CRM en complexe systemen om nieuwe leads te vinden.
    name: ''
  ai_geletterdheid:
    title: AI-geletterdheid
    text: Opleidingen voor groepen, over hoe AI werkt en hoe je het veilig gebruikt. Wij doen daarna de invoering.
    name: ''
  cybersecurity:
    title: Cybersecurity
    text: Je systemen en data goed beveiligd, zeker zodra AI en klantgegevens samenkomen.
    name: ''
  iso:
    title: ISO-certificering
    text: Begeleiding naar een ISO-certificaat, als klanten of aanbestedingen erom vragen.
    name: ''

cta:
  heading: Weten wie je nodig hebt?
  body: Dat zoeken we uit in de strategiesessie. Een uurtje, en je weet wat er gemaakt moet worden en door wie.

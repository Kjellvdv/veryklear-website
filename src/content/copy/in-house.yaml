# In-house page copy (www.veryklear.com/in-house). Was "Fractioneel" on
# /fractioneel until 2026-10-21 (Kjell: "fractioneel is not the right word").
# The offer: someone who works along one day a week. Systems get set up, and
# the operational work happens too.
# Change the text after the colon, keep the indentation. Fields ending in _html
# may contain <br> (line break). No bold in titles.
# No prices on this page: in-house pricing is null in products.yml.

meta:
  title: Freelance head of marketing | Very Klear Marketing Agency
  description: Je marketing uitbesteden aan een freelance head of marketing, een dag (of twee) per week bij jou in huis. Van strategie tot systemen en het operationele werk.

hero:
  title_html: Je marketing uitbesteden<br />aan een freelance head of marketing.
  lead: Geen full-time marketing team nodig? Als freelance head of marketing draaien we elke week een dag (of twee) mee in jouw bedrijf. We vertrekken bij strategie, bouwen de systemen erachter en doen ook het operationele werk.
  button_primary: Plan een strategiesessie
  button_secondary: Vergelijk met een project

when:
  title: Herkenbaar?
  items:
  - Marketing doet iedereen een beetje, naast het eigen werk.
  - Je weet wat er zou moeten gebeuren, maar niemand heeft er de tijd voor.
  - Een voltijdse marketeer aanwerven voelt nog te vroeg.
  - Een bureau levert wat je vraagt, maar niemand denkt mee over wat je nodig hebt.

consequences:
  title: En wat gebeurt er dan?
  lead: Niemand doet iets verkeerd. Je marketing heeft gewoon geen eigenaar.
  items:
  - title: Alles hangt af van wie tijd heeft
    text: Een post als het even rustig is, een mailing als iemand eraan denkt. Wat er gebeurt, hangt af van de week en niet van een plan.
  - title: Opvolging verschilt per persoon
    text: De ene collega belt een aanvraag meteen terug, de andere volgende week. Achteraf weet niemand nog wat er precies gezegd is.
  - title: Tools die niemand bijhoudt
    text: Een CRM dat half ingevuld is, een nieuwsbrief met een lijst van twee jaar oud. De systemen zijn er, maar ze werken niet voor jou.

# The 0 -> 1 timeline. Four steps; the first shows "0", the last "1".
timeline:
  title: Van 0 naar 1, wat betekent dat?
  steps:
  - title: Vertrekpunt
    text: Klanten komen via via, de site is van jaren geleden en opvolging gebeurt op goed geluk.
  - title: De basis
    text: 'Je positionering ligt vast: wie je klant is en waarom die voor jou kiest.'
  - title: De motor
    text: De kanalen zijn gekozen, en je site en opvolging sluiten op elkaar aan.
  - title: Het draait
    text: Je marketing draait op systemen, zonder dat alles van één persoon afhangt.

included:
  title: Wat zit erin?
  base_label: De basis
  base_title: Alle drie de diensten, samen.
  extra_label: Extra
  # Broadened 2026-10-21: systems get set up, and the operational work happens too.
  extras:
  - title: Het operationele werk
    text: Campagnes, content en opvolging die ook echt gebeuren, niet enkel op papier staan.
  - title: Systemen die blijven draaien
    text: Tools, automatisering en rapportering, zo opgezet dat ze ook werken op de dagen dat we er niet zijn.
  - title: Mee aan tafel
    text: Bij je team, je overleg en je partners, zodat marketing geen apart eilandje wordt. Vraagt iets extra expertise, dan brengen we onze eigen partners mee.
  - title: Klantenbeheer
    text: Een CRM dat georganiseerd blijft, met gespreksnotities die achteraf nog iets zeggen.
  - title: Van aanvraag naar verkoop
    text: Een duidelijke weg, in plaats van een proces dat per persoon verschilt.
  - title: Leadlijsten
    text: Wie je nog kan bellen, en die lijst blijft ook bijgehouden.

transformation:
  title: En na een paar maanden?
  lead: Je marketing heeft een eigenaar, en dat merk je elke week.
  before_title: Nu
  before:
  - Marketing gebeurt als iemand er tijd voor vindt.
  - Je weet niet goed welke kanalen iets opbrengen.
  - Aanvragen worden opgevolgd door wie ze toevallig ziet.
  - Je CRM is half ingevuld en niemand vertrouwt het.
  - Elke nieuwe tool is weer een apart eilandje.
  after_title: Met een freelance head of marketing
  after:
  - Elke week staat er iemand voor in, met een plan voor die week.
  - Je weet welke kanalen werken, en daar gaat je tijd naartoe.
  - Elke aanvraag volgt dezelfde weg, van het eerste contact tot het gesprek met sales.
  - Je CRM en je leadlijsten zijn bijgehouden, dus je weet wie je nog kan bellen.
  - Je tools sluiten op elkaar aan en blijven draaien op de dagen dat we er niet zijn.

mid_cta:
  title: Benieuwd wat een dag per week voor jou kan doen?
  text: In een strategiesessie bekijken we samen waar je marketing nu staat en of in-house de juiste vorm is. Een uurtje, eerlijk advies.
  button: Plan een strategiesessie

# Two identical columns, same rows. No "recommended" badge: both paths weigh the same.
compare:
  title: Project of in-house?
  columns:
  - title: Een project
    rows:
    - label: Wat je koopt
      value: Eén duidelijk doel, met een duidelijke scope
    - label: Duur
      value: Enkele weken tot een paar maanden
    - label: Goed als
      value: Je weet waar het knelt en dat eerst wil oplossen
    - label: Prijs
      value: Per project, na een duidelijke scope
    - label: Daarna
      value: Je beslist zelf of er iets bijkomt
  - title: In-house
    rows:
    - label: Wat je koopt
      value: 'Een head of marketing, een dag (of twee) per week in huis: alle drie de diensten, de systemen en het operationele werk'
    - label: Duur
      value: Doorlopend, met vaste momenten om bij te sturen
    - label: Goed als
      value: Je iemand wil die wekelijks meewerkt en het geheel mee opbouwt
    - label: Prijs
      value: Een vaste prijs per maand
    - label: Daarna
      value: Samen bijsturen, zolang het nut heeft

fit:
  yes_title: Past goed als
  yes:
  - je wil groeien en daar ook budget voor hebt
  - je je marketing wil uitbesteden, zonder voltijdse aanwerving
  - er niemand voltijds met marketing bezig is
  - je een partner zoekt, geen uitvoerder zonder mening
  - je iets technisch maakt of verkoopt, daar passen we het best
  no_title: Past niet als
  no:
  - je enkel een paar posts op Instagram zoekt
  - de prijs de doorslag geeft
  - het een bijberoep is zonder groeiplannen
  - je enkel handen wil, niet het denkwerk



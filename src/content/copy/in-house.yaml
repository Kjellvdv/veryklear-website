  title: Een seed ronde aan het ophalen?
  body: VC Rater zoekt de Europese investeerders die echt passen bij jouw ronde, op fase, sector en ticket. Nog in beperkte toegang.
  button: Vraag toegang tot VC Rater

faq:
  title: Vragen over in-house
  items:
  - q: Wat doet een freelance head of marketing?
    a: 'Hetzelfde als een head of marketing in loondienst: richting geven, kiezen wat telt en zorgen dat het ook gebeurt. Alleen werk je samen voor een dag (of twee) per week, zonder voltijdse aanwerving. Je marketing uitbesteden betekent hier dus niet dat ze uit handen is: we werken mee in je team.'
  - q: Waarom geen voltijdse marketeer aanwerven?
    a: 'Als er genoeg werk is voor een voltijdse marketingverantwoordelijke, doe dat zeker. In-house is voor de fase ervoor: je hebt iemand nodig die richting geeft en het geheel opbouwt, maar nog geen volle job.'
  - q: Wat als we al een marketeer hebben?
    a: Dan werken we samen. We geven richting en bouwen de systemen, en je marketeer krijgt iemand om mee te sparren en extra handen voor wat nu blijft liggen.
  - q: Hoe lang loopt een in-house samenwerking?
    a: Doorlopend, met vaste momenten om bij te sturen. Zolang het nut heeft, en we zeggen het als dat niet meer zo is.
  - q: Hoe vaak zijn jullie er?
    a: Een dag (of twee) per week, bij jou of online, plus tussendoor als er iets is. Altijd met dezelfde persoon.
  - q: Wat als het niet klikt?
    a: Dan stoppen we. Een samenwerking die niet werkt rekken heeft voor niemand zin.
  - q: Wat kost in-house?
    a: Een vaste prijs per maand, afhankelijk van een dag of twee per week. Dat bespreken we na de strategiesessie.

cta:
  heading: Even bellen over in-house?
  body: Het begint met een strategiesessie. Een uurtje, eerlijk advies.

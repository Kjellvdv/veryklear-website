# /fractioneel until 2026-10-21 (Kjell: "fractioneel is not the right word").
# The offer: someone who works along one day a week. Systems get set up, and
# the operational work happens too.
# Change the text after the colon, keep the indentation. Fields ending in _html
# may contain <br> (line break). No bold in titles.
# No prices on this page: in-house pricing is null in products.yml.

meta:
  title: Freelance head of marketing | Very Klear Marketing Agency
  description: Je marketing uitbesteden aan een freelance head of marketing, een dag (of twee) per week bij jou op kantoor. Van strategie uitwerken tot systemen bouwen en het operationele werk uitvoeren.

hero:
  title_html: Je marketing uitbesteden<br />aan een freelance head of marketing.
  lead: Geen full-time marketing team nodig? Als freelance head of marketing draaien we elke week een dag (of twee) mee in jouw bedrijf. We vertrekken bij strategie, bouwen de systemen erachter en doen ook het operationele werk.
  button_primary: Plan een strategiesessie
  button_secondary: Vergelijk met een project

when:
  title: Herkenbaar?
  items:
  - Iedereen doet af en toe een beetje marketing.
  - Je hebt een idee van wat er zou moeten gebeuren, maar niemand heeft er de tijd voor.
  - Er is niet genoeg werk of budget om een voltijdse marketeer aan te werven.
  - Een agency levert wat je vraagt, maar niemand denkt mee over wat je echt nodig hebt.

consequences:
  title: En wat gebeurt er dan?
  lead: Niemand doet iets verkeerd. Want er gebeurt niets. En groei blijft uit.
  items:
  - title: Alles hangt af van wie tijd heeft en het werk blijft vaak liggen.
    text: Wat er wel gebeurt, hangt af van week tot week en er is geen duidelijk plan.
  - title: De website en sociale media kanalen zijn niet meer van deze tijd.
    text: Alles raakt verouderd, maar er is niemand met de juiste vaardigheden om het op punt te houden.
  - title: Je betaalt te veel voor campagnes die niets opleveren.
    text: 'Ads, social media, nieuwsbrieven besteed je allemaal uit aan een agency, maar niemand heeft het over het resultaat dat telt: jouw omzet.'

# The 0 -> 1 timeline. Four steps; the first shows "0", the last "1".
timeline:
  title: Marketing opzetten van 0 naar 1
  steps:
  - title: Vertrekpunt
    text: Alles begint bij een duidelijk verhaal en een gerichte strategie.
  - title: De funderingen leggen
    text: 'We kiezen de juiste tools en voorzien de basis om je marketing rond uit te werken.'
  - title: De boel op gang brengen
    text: Een presentatie alleen doet niets. We steken de handen uit de mouwen om denkwerk om te zetten in concrete campagnes.
  - title: Bijsturen en versnellen
    text: AI-tools werken steeds beter en er komt ruimte vrij om te experimenteren en te optimaliseren.

included:
  title: Wat mag je verwachten van een vaste samenwerking?
  base_label: De basis
  base_title: We vertrekken vanuit een duidelijk doel en concreet marketingplan.
  extra_label: Strategie + implementatie
  # Broadened 2026-10-21: systems get set up, and the operational work happens too.
  extras:
  - title: Van marketingstrategie naar actie
    text: Campagnes, content en marketingactiviteiten worden wekelijks opgevolgd.
  - title: Systemen die blijven draaien
    text: Tools, automatisering en rapportering worden zo opgezet dat ze ook werken op de dagen dat we er niet zijn.
  - title: Samenwerken met je team
    text: In tijden van AI is marketing minder dan ooit een apart eilandje. We werken nauw samen met je team om de juiste tools en ondersteuning te voorzien.
  - title: Klantenbeheer
    text: Een CRM dat georganiseerd blijft, met gespreksnotities die achteraf nog iets zeggen.
  - title: Van aanvraag naar verkoop
    text: Marketing moet niet alleen leads bezorgen. We zorgen ook voor vlottere sales en tevreden klanten.
  - title: Meer leads nodig?
    text: We zorgen voor relevante signalen, al dan niet met gespecialiseerde partners.

transformation:
  title: En na een paar maanden?
  lead: Je marketing heeft een eigenaar, en dat merk je elke week.
  before_title: Nu
  before:
  - Marketing gebeurt als iemand er tijd voor vindt.
  - Je weet niet goed welke kanalen iets opbrengen.
  - Iedereen pakt sales aan op zijn manier.
  - Je CRM is een collectie visitekaartjes.
  - Elke nieuwe tool is weer een apart eilandje.
  after_title: Met een freelance head of marketing
  after:
  - Elke week voert iemand het werk uit met een plan van aanpak.
  - Je weet welke kanalen werken, en daar gaat je tijd naartoe.
  - Sales heeft de juiste ondersteuning om consistent te werken.
  - Je CRM en je leadlijsten zijn bijgehouden, dus je weet wie je nog kan bellen.
  - Je tools sluiten op elkaar aan en blijven draaien op de dagen dat we er niet zijn.

mid_cta:
  title: Benieuwd wat een dag per week voor jou kan doen?
  text: In een strategiesessie bekijken we samen waar je marketing nu staat en of een vaste samenwerking de juiste vorm is.
  button: Plan een strategiesessie

# Two identical columns, same rows. No "recommended" badge: both paths weigh the same.
compare:
  title: Per project of een vaste samenwerking?
  columns:
  - title: Een project
    rows:
    - label: Wat je koopt
      value: Eén duidelijk doel, met een duidelijke scope
    - label: Duur
      value: Meestal een paar weken
    - label: Goed als
      value: Je weet waar het knelt en dat eerst wil oplossen
    - label: Prijs
      value: Per project met een duidelijke scope
    - label: Daarna
      value: Je beslist zelf of er iets bijkomt
  - title: Wekelijkse samenwerking
    rows:
    - label: Wat je koopt
      value: 'Een head of marketing, een dag (of twee) per week op kantoor'
    - label: Duur
      value: Doorlopend, met vaste momenten om bij te sturen
    - label: Goed als
      value: Je iemand wil die wekelijks meewerkt en strategisch meedenkt
    - label: Prijs
      value: Een vaste prijs per maand
    - label: Daarna
      value: Je neemt het zelf over of zoekt een vaste medewerker

fit:
  yes_title: Past goed als
  yes:
  - je wil groeien en daar ook budget voor hebt
  - je je marketing wil uitbesteden, zonder voltijdse aanwerving
  - er niemand voltijds met marketing bezig is
  - je een partner zoekt, geen uitvoerder zonder mening
  - je iets technisch maakt of verkoopt, daar passen we het best
  no_title: Past niet als
  no:
  - je enkel een paar posts op Instagram zoekt
  - je niet wil investeren in marketing
  - je niet wil experimenteren en zelf alle controle wil
  - je enkel uitvoering wil, niet het denkwerk



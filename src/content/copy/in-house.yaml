# In-house page copy (www.veryklear.com/in-house). Was "Fractioneel" on
# /fractioneel until 2026-10-21 (Kjell: "fractioneel is not the right word").
# The offer: someone who works along one day a week. Systems get set up, and
# the operational work happens too.
# Change the text after the colon, keep the indentation. Fields ending in _html
# may contain <br> (line break). No bold in titles.
# No prices on this page: in-house pricing is null in products.yml.

meta:
  title: Head of marketing in-house · Very Klear
  description: Een head of marketing die elke week een dag (of twee) bij jou meewerkt. De systemen worden opgezet, en het operationele werk gebeurt ook, zonder voltijdse aanwerving.

hero:
  title_html: Je head of marketing,<br />een dag (of twee) per week in huis.
  lead: Iemand die elke week een dag (of twee) bij jou meewerkt. Ondertussen zetten we de systemen op, en gebeurt ook het operationele werk. Van 0 naar 1, met dezelfde persoon en zonder voltijdse aanwerving.
  button_primary: Plan een strategiesessie
  button_secondary: Vergelijk met op projectbasis

# The 0 -> 1 timeline. Four steps; the first shows "0", the last "1".
timeline:
  title: Wat 'van 0 naar 1' betekent.
  steps:
    - title: Vertrekpunt
      text: Klanten via via, een site van jaren geleden, opvolging op goed geluk.
    - title: De basis
      text: 'Positionering vastgelegd: wie je klant is en waarom die voor jou kiest.'
    - title: De motor
      text: Kanalen gekozen, site en opvolging die op elkaar aansluiten.
    - title: Het draait
      text: Een systeem dat werkt zonder dat alles van één persoon afhangt.

included:
  title: Wat er in zit.
  base_label: De basis
  base_title: Alle drie de diensten, samen.
  extra_label: Extra
  # Broadened 2026-10-21: systems get set up, and the operational work happens too.
  extras:
    - title: Het operationele werk
      text: Campagnes, content en opvolging die ook echt gebeuren, niet enkel op papier staan.
    - title: Systemen die blijven draaien
      text: Tools, automatisering en rapportering, zo opgezet dat ze ook werken op de dagen dat we er niet zijn.
    - title: Mee aan tafel
      text: Bij je team, je overleg en je partners, zodat marketing geen apart eilandje wordt.
    - title: Klantenbeheer
      text: Een CRM dat georganiseerd blijft, met gespreksnotities die achteraf nog iets zeggen.
    - title: Van aanvraag naar verkoop
      text: Een duidelijke weg, in plaats van een proces dat per persoon verschilt.
    - title: Leadlijsten
      text: Wie je nog kan bellen, en die lijst blijft ook bijgehouden.

# Two identical columns, same rows. No "recommended" badge: both paths weigh the same.
compare:
  title: Op projectbasis of in-house?
  columns:
    - title: Op projectbasis
      rows:
        - label: Wat je koopt
          value: Eén dienst, of een paar na elkaar
        - label: Duur
          value: Een paar maanden, met een duidelijk einde
        - label: Goed als
          value: Je weet waar het knelt en dat eerst wil oplossen
        - label: Daarna
          value: Je beslist zelf of er iets bijkomt
    - title: In-house
      rows:
        - label: Wat je koopt
          value: 'Een head of marketing, een dag (of twee) per week in huis: alle drie de diensten, de systemen en het operationele werk'
        - label: Duur
          value: Doorlopend, met vaste momenten
        - label: Goed als
          value: Je iemand wil die wekelijks meewerkt en het geheel mee opbouwt
        - label: Daarna
          value: Samen bijsturen, zolang het nut heeft

fit:
  yes_title: Past goed als
  yes:
    - je wil groeien en daar ook budget voor hebt
    - je zelf de marketingkeuzes maakt
    - er niemand voltijds met marketing bezig is
    - je een partner zoekt, geen uitvoerder zonder mening
    - je iets technisch maakt of verkoopt, daar passen we het best
  no_title: Past niet als
  no:
    - je enkel een paar posts op Instagram zoekt
    - de prijs de doorslag geeft
    - het een bijberoep is zonder groeiplannen
    - je enkel handen wil, niet het denkwerk


# VC Rater: Kjell's own product. Shown on this page only (Kjell, 2026-10-05).
vcrater:
  label: Ook van ons · VC Rater
  title: Een seed ronde aan het ophalen?
  body: VC Rater zoekt de Europese investeerders die echt passen bij jouw ronde, op fase, sector en ticket. Nog in beperkte toegang.
  button: Vraag toegang tot VC Rater

faq:
  title: Vragen over in-house.
  items:
    - q: Waarom geen voltijdse marketeer aanwerven?
      a: 'Als er genoeg werk is voor een voltijdse marketingverantwoordelijke, doe dat zeker. In-house is voor de fase ervoor: je hebt iemand nodig die richting geeft en het geheel opbouwt, maar nog geen volle job.'
    - q: Hoe lang loopt een in-house samenwerking?
      a: Doorlopend, met vaste momenten om bij te sturen. Zolang het nut heeft, en we zeggen het als dat niet meer zo is.
    - q: Hoe vaak hebben we contact?
      a: Vaste momenten die we samen afspreken, plus tussendoor als er iets is. Altijd met dezelfde persoon.
    - q: Wat als het niet klikt?
      a: Dan stoppen we. Een samenwerking die niet werkt rekken heeft voor niemand zin.
    - q: Wat kost in-house?
      a: Dat hangt af van wat er nodig is. We bespreken het na de strategiesessie, met een duidelijke scope.

cta:
  heading: Kijken of een head of marketing in huis past?
  body: Het begint met hetzelfde gesprek als elke andere weg. Een uur, eerlijk advies.

# Diensten overview (veryklear.com/diensten): the short version.
# Each pillar has its own page with the full story; edit those in
# dienst-positionering.yaml, dienst-marketing-strategie.yaml and
# dienst-ai-implementeren.yaml. Partners live in partners.yaml.
# Change the text after the colon, keep the indentation. Fields ending in _html
# may contain <br> or <strong>.

meta:
  title: Diensten · Very Klear
  description: 'Op projectbasis: positionering, marketing strategie of AI implementeren. Drie diensten die in elkaar overlopen.'

hero:
  title_html: Drie diensten.<br />Begin waar het knelt.
  lead: Positionering, marketing strategie en AI implementeren. Je kan bij elk van de drie instappen, en vaak volgt het ene uit het andere.

# One card per dienst, in this order. No numbers or 'pijler': they're entry points
# that overlap or follow each other (Kjell, 2026-10-07).
pillars:
  - title: Positionering
    text: Waar je zaak past in de markt, wie je ideale klant is, en waarom die voor jou kiest.
    points:
      - In welke categorie speel je?
      - Wie is je ideale klant?
      - Waarom kiezen klanten voor jou?
    link: Meer over positionering →
  - title: Marketing strategie
    text: Welke kanalen, tools en mensen, en of alles op elkaar aansluit, van advertentie tot landingspagina.
    points:
      - Welke kanalen, en welke niet?
      - Hoeveel tijd, mensen en tools?
      - Klopt je customer journey?
    link: Meer over marketing strategie →
  - title: AI implementeren
    text: AI aan het werk zetten waar het echt helpt, en duidelijk maken wat beter mensenwerk blijft.
    points:
      - Eén manier van werken voor het team
      - Script waar het kan, AI waar het moet
      - Eén toepassing die effectief draait
    link: Meer over AI implementeren →

partners:
  title: Meer dan wat één persoon aankan.
  lead: Voor wat buiten onze diensten valt, werken we met vaste partners, van design en fotografie tot CRM. Het denkwerk en het contact blijven bij ons.
  link: Bekijk de partners →

fractional:
  title: Liever alles samen?
  text: Als fractionele head of marketing nemen we alle drie de diensten op, plus klantenbeheer en opvolging.
  link: Naar fractioneel →

faq:
  title: Waar begin je best?
  items:
    - q: Moet ik met positionering beginnen?
      a: Meestal wel, want de andere twee bouwen erop voort. Staat je positionering al, dan kan je meteen naar marketing strategie of AI implementeren.
    - q: Kunnen jullie niet gewoon de website doen?
      a: Dat kan, op vraag. Meestal komt een website er als onderdeel van positionering of marketing strategie, zodat ze op iets echts gebouwd is.
    - q: Hoe lang duurt het?
      a: 'Een paar maanden, met vaste momenten. Het is geen sessie en geen rapport: testen en bijsturen hoort erbij.'
    - q: Kan ik later iets bijnemen?
      a: Ja, dat is normaal. Vaak volgt de ene dienst uit de andere. Alles in één keer kopen is zelden de beste start.

cta:
  heading: Twijfel je waar je begint?
  body: Daar is de strategiesessie voor. Een uur, en je weet waar je het best begint.

  - Je gebruikt ChatGPT, Gemini of Claude, maar elke keer leg je opnieuw uit wie je bent.
  - Wat eruit komt, klinkt als iedereen en ziet er ook zo uit.
  - Een tekst of flyer uit AI vraagt je daarna toch nog een uur bijsturen.
  - Je volgde al eens een opleiding, maar thuis lukt het niet meer zoals in de les.

# Done with you vs a classic workshop (Kjell, 2026-11-16).
difference:
  title: Waarom dit meer is dan een workshop
  lead: In een klassieke workshop doe je het meeste zelf, terwijl een lesgever over je schouder meekijkt. Bij ons is het omgekeerd. Wij leggen de basis en zetten alles op, en jij kijkt over onze schouder mee om de details juist te krijgen.

included:
  title: Wat heb je na één dag?
  items:
  - title: Je merk staat vast in je tool
    text: Je verhaal, je schrijfstijl en je huisstijl staan uitgeschreven en liggen vast in je AI-tool. Zo hoef je nooit meer uit te leggen wie je bent.
  - title: Een vaste instructie per taak
    text: Voor elke taak die vaak terugkomt, zoals een nieuwsbrief, een advertentie of een post, krijg je een vaste instructie. Zo volgt het resultaat meteen je stijl, zonder dat je alles opnieuw moet uitleggen.
  - title: In de tool die je al gebruikt
    text: Alles werkt in Claude, Gemini of ChatGPT. Je hebt wel een betalend abonnement nodig.
  - title: Getest op je eigen werk
    text: We maken samen de eerste stukken en sturen bij tot ze klinken en eruitzien zoals jij het wil.
  - title: Eén persoon of je hele team
    text: Wie erbij zit, kies je zelf. En daarna werkt iedereen met dezelfde instructies.
  - title: Een maand antwoorden
    text: Loop je daarna ergens op vast, dan mail je ons gewoon je vraag. De hele maand na de workshop beantwoorden we ze allemaal.

steps:
  title: Hoe verloopt de dag?
  items:
  - title: We bereiden voor
    text: Vooraf sturen we je een korte vragenlijst over je bedrijf, je klanten en wat je met AI wil maken, en vragen we wat voorbeelden, zoals je logo, je huisstijl en teksten waar je trots op bent. Liever samen invullen? Dan doen we dat op de dag zelf.
  - title: We zetten alles samen op
    text: Een volledige dag bij jou op kantoor. Eerst zetten we de richtlijnen en skills op in je eigen tool, dan maken we samen de eerste visuals en teksten en sturen we bij tot alles klopt.
  - title: Je gaat zelf aan de slag
    text: Daarna werk je er zelf mee. Loop je vast of wil je iets bijsturen, dan mail je ons en zoeken we het samen uit.

price:
  label: Prijs
  amount: €749 excl. btw
  text: Een volledige dag bij jou op kantoor, overal in Vlaanderen. De voorbereiding en een maand vragen achteraf zijn inbegrepen. Ligt je kantoor meer dan 100 km van ons kantoor in Ieper, dan rekenen we de verplaatsing apart.
  button: Vraag een datum aan

fit:
  yes_title: Past goed als
  yes:
  - je AI al gebruikt of wil gebruiken voor je marketing
  - je wil dat alles klinkt en eruitziet als jouw bedrijf
  - je liever één dag goed investeert dan maanden zelf zoekt
  - je een betalend abonnement hebt op Claude, Gemini of ChatGPT, of er een wil nemen
  no_title: Past niet als
  no:
  - je een opleiding AI-geletterdheid zoekt voor een grote groep, want daarvoor werken we met een partner
  - je wil dat AI alles alleen doet, zonder dat iemand nog meekijkt
  - je na de dag geen tijd vrijmaakt om het ook te gebruiken


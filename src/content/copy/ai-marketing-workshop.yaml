faq:
  title: Vragen over de AI-marketingworkshop
  items:
  - q: Welke AI-tool heb ik nodig?
    a: Claude, Gemini of ChatGPT, met een betalend abonnement. Heb je er nog geen, dan helpen we je kiezen voor de dag.
  - q: Wat kan ik er daarna mee maken?
    a: 'Dat kies je zelf: visuals, nieuwsbrieven, ads, posts voor sociale media, blogartikels, landingspagina''s of webdesign. We laten werken wat jij nodig hebt.'
  - q: Werkt het ook als ik nog geen huisstijl of nieuwsbrief heb?
    a: Ja. We vertrekken van wat er al is, zoals je website, je logo en hoe je over je werk praat, en schrijven daar samen de richtlijnen uit. Een volledige huisstijl ontwerpen zit er niet in, maar je hebt er ook geen nodig om te beginnen.
  - q: Wat kost de AI-marketingworkshop?
    a: €749 excl. btw voor een volledige dag bij jou op kantoor, met de voorbereiding en een maand vragen achteraf. Ligt je kantoor meer dan 100 km van ons kantoor in Ieper, dan rekenen we de verplaatsing apart.
  - q: Hoe boek ik de workshop?
    a: Stuur ons een mail met een paar data die je passen. Wil je eerst kennismaken, dan plan je een strategiesessie van een uurtje en bekijken we samen of de dag bij je past.

cta:
  heading: Klaar om je AI te leren hoe jij werkt?
  body: Mail ons een paar data die je passen, en dan leggen we de dag vast.
  button: Vraag een datum aan
